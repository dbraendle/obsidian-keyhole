# Updates are proposed as pull requests; nothing merges without review.
# The cooldown keeps freshly published (possibly compromised) versions out.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (see AGENTS.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The Node types follow the Node version CI runs on.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
